<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- A whole pizza that opens like a book: the left half lies flat, the right half is turning. -->
  <defs>
    <linearGradient id="turn" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0.45"/>
      <stop offset="0.55" stop-color="#000" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.10"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="#1a1008"/>
  <!-- the turning half is narrower, so shift the whole pizza right to centre it -->
  <g transform="translate(37 0)">

  <!-- left half: flat -->
  <path d="M248 82 A174 174 0 0 0 248 430 Z" fill="#d9a55b"/>
  <path d="M248 108 A148 148 0 0 0 248 404 Z" fill="#c8452b"/>
  <circle cx="190" cy="186" r="22" fill="#f4e4bc"/>
  <circle cx="150" cy="270" r="20" fill="#f4e4bc"/>
  <circle cx="206" cy="336" r="22" fill="#f4e4bc"/>
  <circle cx="214" cy="252" r="11" fill="#3f7d3a"/>
  <circle cx="160" cy="330" r="10" fill="#3f7d3a"/>

  <!-- right half: turning (narrower, shaded towards the spine) -->
  <path d="M264 82 A100 174 0 0 1 264 430 Z" fill="#d9a55b"/>
  <path d="M264 108 A84 148 0 0 1 264 404 Z" fill="#c8452b"/>
  <ellipse cx="300" cy="190" rx="13" ry="22" fill="#f4e4bc"/>
  <ellipse cx="322" cy="276" rx="12" ry="20" fill="#f4e4bc"/>
  <ellipse cx="296" cy="340" rx="13" ry="22" fill="#f4e4bc"/>
  <ellipse cx="290" cy="258" rx="6" ry="11" fill="#3f7d3a"/>
  <path d="M264 82 A100 174 0 0 1 264 430 Z" fill="url(#turn)"/>
  </g>
</svg>
